<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Грузоперевозки и Автосервис — ТРАНС-СЕРВИС{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
        const savedTheme = localStorage.getItem('fansport_theme') || 'dark';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="transition-colors duration-300 bg-slate-50 dark:bg-slate-950 text-slate-950 dark:text-white flex flex-col min-h-screen">

    <!-- Навигационная панель -->
    <nav class="bg-white/90 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-40 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                
                <div class="flex items-center space-x-4 sm:space-x-6">
                    <a href="{% url 'home' %}" class="text-xl font-black tracking-tight text-indigo-600 dark:text-indigo-400">ТРАНС-СЕРВИС</a>
                    <div class="hidden sm:block h-6 w-px bg-slate-200 dark:bg-slate-800"></div>
                    
                    <div class="flex items-center space-x-4 sm:space-x-6">
                        <!-- Изменены ссылки на реальные страницы вместо якорей -->
                        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}text-indigo-600 dark:text-indigo-400 font-bold border-b-2 border-indigo-600 dark:border-indigo-400 pb-1{% else %}text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium{% endif %} transition duration-150 text-xs sm:text-sm">Главная</a>
                        <span class="text-slate-300 dark:text-slate-700 text-xs">|</span>
                        <a href="{% url 'catalog' %}" class="{% if request.resolver_match.url_name == 'catalog' %}text-indigo-600 dark:text-indigo-400 font-bold border-b-2 border-indigo-600 dark:border-indigo-400 pb-1{% else %}text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium{% endif %} transition duration-150 text-xs sm:text-sm">Услуги</a>
                        
                        {% if user.is_staff or user.is_superuser %}
                            <span class="text-slate-300 dark:text-slate-700 text-xs">|</span>
                            <a href="{% url 'manager_dashboard' %}" class="{% if request.resolver_match.url_name == 'manager_dashboard' %}text-indigo-600 dark:text-indigo-400 font-bold border-b-2 border-indigo-600 dark:border-indigo-400 pb-1{% else %}text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium{% endif %} transition duration-150 text-xs sm:text-sm">Панель</a>
                        {% endif %}
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <!-- Смена темы -->
                    <button onclick="toggleTheme()" class="text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition focus:outline-none">
                        <svg id="themeMoon" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                        <svg id="themeSun" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m2.828-9.9a5 5 0 117.07 7.07m-7.07-7.07l.707-.707" />
                        </svg>
                    </button>

                    {% if user.is_authenticated %}
                        <a href="{% url 'profile' %}" class="hidden sm:inline text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition text-xs sm:text-sm">Профиль ({{ user.username }})</a>
                        <form action="{% url 'logout' %}" method="post" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-red-500 hover:text-red-600 font-medium transition text-xs sm:text-sm">Выйти</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition text-xs sm:text-sm">Войти</a>
                        <a href="{% url 'register' %}" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl font-medium hover:bg-indigo-700 transition shadow-sm text-xs sm:text-sm">Регистрация</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Тосты -->
    <div id="toastContainer" class="fixed top-20 right-4 z-[120] pointer-events-none space-y-2"></div>

    <!-- Основной контент -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-400 text-sm">
            &copy; {% now "Y" %} ТРАНС-СЕРВИС. Все права защищены.
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const sun = document.getElementById('themeSun');
            const moon = document.getElementById('themeMoon');

            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('fansport_theme', 'light');
                sun.classList.add('hidden');
                moon.classList.remove('hidden');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('fansport_theme', 'dark');
                moon.classList.add('hidden');
                sun.classList.remove('hidden');
            }
        }

        function showSuccessToast(message) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = "flex items-center space-x-3 bg-white dark:bg-slate-800 text-slate-900 dark:text-white px-5 py-4 rounded-2xl shadow-2xl border border-slate-150 dark:border-slate-700 transform translate-x-12 opacity-0 transition-all duration-300 pointer-events-auto max-w-sm";
            toast.innerHTML = `
                <div class="flex-shrink-0 w-10 h-10 rounded-full bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 flex items-center justify-center">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <div class="flex-grow min-w-0">
                    <p class="text-sm font-bold text-slate-900 dark:text-white">Успешно отправлено</p>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 leading-relaxed">${message}</p>
                </div>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-x-12', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-x-12', 'opacity-0');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 4000);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const isDark = document.documentElement.classList.contains('dark');
            const sun = document.getElementById('themeSun');
            const moon = document.getElementById('themeMoon');
            if (isDark) {
                sun.classList.remove('hidden');
            } else {
                moon.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
